# /etc/nginx/sites-available/rkmsiem — TLS 종단 리버스 프록시 (외부 공개는 이것만)
# 인증서: sudo certbot --nginx -d siem.example.com  (또는 사내 CA 인증서 경로로 교체)
# 적용: sudo ln -s /etc/nginx/sites-available/rkmsiem /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 443 ssl http2;
    server_name siem.example.com;

    ssl_certificate     /etc/letsencrypt/live/siem.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siem.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 관리 접속 허용 대역만 (예시) — 필요에 맞게 수정
    # allow 10.0.0.0/8;
    # deny all;

    client_max_body_size 2m;

    location /api/stream {                     # 실시간(SSE): 버퍼링 끄기
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 80;
    server_name siem.example.com;
    return 301 https://$host$request_uri;
}
