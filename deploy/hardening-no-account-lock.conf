# /etc/systemd/system/rkmsiem.service.d/hardening.conf
# 계정 잠금(sudo 헬퍼)을 쓰지 않을 때 적용하는 강화 설정 — install.sh --no-account-lock 이 설치
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_NET_ADMIN
ProtectSystem=strict
ReadWritePaths=/var/lib/rkmsiem
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallArchitectures=native
MemoryDenyWriteExecute=no
