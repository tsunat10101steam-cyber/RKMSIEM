# 추가 기능 설명서 (deploy/addon.sh 가 읽음 — 셸 변수)
ID=hsoar
NAME="HSOAR"
DESC="Slack 으로 관리하는 자동 대응 — 경보·승인 요청·사람 할 일을 Slack 으로, 버튼으로 승인·차단·잠금, /hsoar 명령, 자동 대응 등급(off·dry·on)·킬 스위치"
VERSION=1
AVAILABLE=1
# 핵심(RKMSIEM)이 이 추가 기능에 줄 API 토큰 권한 — 이것 밖의 일은 못 함
SCOPES="feed:read alerts:read incidents:read incidents:write runs:read playbooks:run runs:approve runs:cancel"
SERVICE=rkmsiem-hsoar
CONFIGURE=configure.sh         # 메뉴 '설정' (Slack 토큰·채널·허용된 사람)
STATUS=status.sh               # 메뉴 '상태 확인'
