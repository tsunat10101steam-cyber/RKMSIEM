# Ubuntu 운영 데이터 소스
# - 기본: rsyslog 가 쓰는 /var/log/auth.log (Ubuntu 22.04 전통 형식 · 24.04 RFC3339 형식 모두 지원)
# - rsyslog 가 없는 최소 설치라면 ubuntu-authlog 를 끄고 journald-auth 를 켠다 (둘 다 켜면 같은 로그가 두 번 들어옴)

x-auth-extract: &auth_extract
  # ---- sshd (OpenSSH 9.8+ 는 프로그램 이름이 sshd-session) ----
  - program_regex: '^sshd(-session)?$'
    pattern: 'Failed (?:password|publickey|keyboard-interactive/pam|none) for (?:invalid user )?(?P<user>\S*) from (?P<ip>[0-9a-fA-F:.]+)'
    category: authentication
    outcome: failure
    action: ssh_login
  - program_regex: '^sshd(-session)?$'
    pattern: 'Accepted \S+ for (?P<user>\S+) from (?P<ip>[0-9a-fA-F:.]+)'
    category: authentication
    outcome: success
    action: ssh_login
  # 키 인증만 허용하는 서버(PasswordAuthentication no)에서는 'Failed password' 줄이 없다 → 아래를 켠다
  # (비밀번호 인증이 켜진 서버에서 켜면 같은 시도가 두 번 셀 수 있음)
  - program_regex: '^sshd(-session)?$'
    enabled: false
    pattern: 'Connection closed by (?:authenticating|invalid) user (?P<user>\S*) (?P<ip>[0-9a-fA-F:.]+) port \d+ \[preauth\]'
    category: authentication
    outcome: failure
    action: ssh_preauth_closed
  # 기록·검색용 (실패 횟수에는 넣지 않음: 뒤따르는 'Failed password for invalid user' 와 중복)
  - program_regex: '^sshd(-session)?$'
    pattern: 'Invalid user (?P<user>\S*) from (?P<ip>[0-9a-fA-F:.]+)'
    category: authentication
    outcome: unknown
    action: ssh_invalid_user
  - program_regex: '^sshd(-session)?$'
    pattern: 'maximum authentication attempts exceeded for (?:invalid user )?(?P<user>\S+) from (?P<ip>[0-9a-fA-F:.]+)'
    category: authentication
    outcome: unknown
    action: ssh_max_attempts
  # ---- sudo ----
  - program: sudo
    pattern: '^\s*(?P<user>\S+) : \d+ incorrect password attempts?'
    category: authentication
    outcome: failure
    action: sudo_auth
  - program: sudo
    pattern: '^\s*(?P<user>\S+) : (?:.*; )?TTY=.*COMMAND='
    category: iam
    outcome: success
    action: privilege_use
  # ---- su ----
  - program: su
    pattern: 'FAILED SU \(to (?P<target_user>\S+)\) (?P<user>\S+) on'
    category: authentication
    outcome: failure
    action: su_auth
  - program: su
    pattern: 'Successful su for (?P<target_user>\S+) by (?P<user>\S+)'
    category: iam
    outcome: success
    action: privilege_use
  - program: su
    pattern: 'pam_unix\(su(?:-l)?:session\): session opened for user (?P<target_user>[^\s(]+)(?:\(uid=\d+\))? by (?P<user>[^\s(]+)'
    category: iam
    outcome: success
    action: privilege_use

sources:
  - id: ubuntu-authlog
    type: file
    parser: linux_syslog
    enabled: true
    dataset: linux.auth
    options:
      path: /var/log/auth.log
      from_beginning: false        # 설치 이후부터 수집 (과거 로그까지 분석하려면 true)
      poll_sec: 0.5
      timezone: Asia/Seoul         # settings.timezone 과 같게
      drop_unmatched: false        # true 면 위 규칙에 안 맞는 줄(cron 세션 등)은 저장하지 않음
      extract: *auth_extract

  - id: journald-auth
    type: journald
    parser: journald
    enabled: false
    dataset: linux.journal
    options:
      units: []                    # 비우고 identifiers 로 거름
      identifiers: [sshd, sshd-session, sudo, su]
      since: now
      extract: *auth_extract

  - id: http-json
    type: http                     # POST /api/ingest/http-json (X-API-Key) — 다른 시스템 연동용
    parser: json
    enabled: true
    dataset: http.events
    options:
      timezone: UTC
      default_category: authentication
      field_map:
        "@timestamp": timestamp
        event.id: id
        event.action: action
        event.outcome: outcome
        event.category: category
        source.ip: src_ip
        destination.ip: dst_ip
        destination.port: dst_port
        user.name: user
        host.name: host
        message: message

  - id: syslog-udp                 # 다른 서버의 로그를 원격으로 받을 때 켬 (host 를 0.0.0.0 로, 방화벽에서 허용 IP 만)
    type: syslog_udp
    parser: syslog
    enabled: false
    dataset: syslog.remote
    options:
      host: 127.0.0.1
      port: 5514
      timezone: Asia/Seoul
      extract: *auth_extract

  - id: suricata-eve               # Suricata IDS 의 eve.json — IDS 서버의 rkmsiem-ship-eve 가 POST /api/ingest/suricata-eve 로 보냄
    type: http
    parser: suricata_eve
    enabled: true
    dataset: suricata.eve
    options:
      timezone: UTC                # eve 의 timestamp 는 오프셋이 붙어 있어 그대로 해석됨
      event_types: [alert, anomaly]
