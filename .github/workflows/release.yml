# 버전 태그(v31 …)를 올리거나 Actions 화면에서 버전을 넣고 실행하면: 테스트 → 배포 묶음(.deb · .tgz) → GitHub 릴리스(태그 생성 포함)
# 설치된 서버의 업데이트 화면(rkmsiem-setup → 업데이트)은 releases/latest 의 rkmsiem_all.deb 를 받는다.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "버전 번호 (예: 31 → 태그 v31)"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                # 릴리스 노트: 이전 태그 이후 커밋 목록
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 테스트
        run: |
          sudo apt-get install -y -q openssh-client
          pip install -q -r requirements.txt
          python -m pytest -q
      - name: 버전
        env:
          IN: ${{ inputs.version }}
        run: |
          V="${IN:-${GITHUB_REF_NAME#v}}"; V="${V#v}"
          [[ "$V" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "버전 형식 오류: $V"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - name: 배포 묶음 만들기
        run: python deploy/build-deb.py "$V"
      - name: 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          git log --no-merges --format='- %s' ${PREV:+$PREV..}HEAD > notes.txt
          gh release create "v$V" --target "$GITHUB_SHA" --title "RKMSIEM v$V" --notes-file notes.txt \
            dist/rkmsiem_all.deb "dist/rkmsiem_${V}_all.deb" "dist/rkmsiem-v${V}.tgz"

  # 윈도우 클라이언트(엔드포인트 에이전트) 단일 exe — windows 러너에서 빌드해 같은 릴리스에 올림
  winagent:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 버전
        shell: bash
        env:
          IN: ${{ inputs.version }}
        run: |
          V="${IN:-${GITHUB_REF_NAME#v}}"; V="${V#v}"
          echo "V=$V" >> "$GITHUB_ENV"
      - name: exe 빌드 (PyInstaller · 표준 라이브러리만)
        shell: bash
        run: |
          pip install -q pyinstaller pystray pillow
          python web/winagent/build-exe.py
      - name: 설치 마법사 빌드 (Inno Setup)
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$ISCC" "//DAppVersion=$V" web/winagent/installer.iss
      - name: 릴리스에 올리기 (설치 마법사 + 단일 exe)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$V" web/winagent/Output/rkmsiem-winagent-setup.exe --clobber
          gh release upload "v$V" web/winagent/dist/rkmsiem-winagent.exe --clobber
