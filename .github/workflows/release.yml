# 버전 태그(v31 …)를 올리면: 테스트 → 배포 묶음(.deb · .tgz) 만들기 → GitHub 릴리스 생성
# 설치된 서버의 업데이트 화면(rkmsiem-setup → 업데이트)은 releases/latest 의 rkmsiem_all.deb 를 받는다.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 테스트
        run: |
          sudo apt-get install -y -q openssh-client
          pip install -q -r requirements.txt
          python -m pytest -q
      - name: 배포 묶음 만들기
        run: python deploy/build-deb.py "${GITHUB_REF_NAME#v}"
      - name: 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "RKMSIEM $GITHUB_REF_NAME" --notes-file <(git log -1 --format=%B "$GITHUB_REF_NAME") \
            dist/rkmsiem_all.deb "dist/rkmsiem_${V}_all.deb" "dist/rkmsiem-v${V}.tgz"
