id: distributed_attack_response
name: 분산 공격 대응
description: 봇넷형 분산 공격 → 표적 계정 확인 → 알림 → 기록 (계정 단위 추가 인증 권고)
enabled: true
trigger:
  on: alert
  where:
    - {field: alert.rule_id, op: eq, value: distributed_attack}
steps:
  - id: asset
    action: asset_lookup
    input: {account: "{{alert.group.user.name}}"}
    on_failure: continue
  - id: notify_soc
    action: notify
    input: {channel: soc, message: "[분산 공격] {{alert.group.user.name}} 계정에 다수 IP 공격 — 추가 인증/로그인 제한 검토 (사건 #{{incident.id}})"}
  - id: record
    action: record_result
    input: {summary: "표적 계정 {{alert.group.user.name}} · 소유 {{steps.asset.output.owner}} · 권한계정 {{steps.asset.output.privileged}}"}
