id: password_spray
name: 패스워드 스프레이
enabled: true
type: distinct_count
where:
  - {field: event.category, op: contains, value: authentication}
  - {field: event.outcome, op: eq, value: failure}
group_by: [source.ip]
distinct_field: user.name
window_sec: 900
levels:
  - id: SPRAY
    min: 5
    severity: high
    title: 패스워드 스프레이
incident_key: [source.ip]
